<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для Анечки ☁</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05060a">
<meta name="description" content="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%98%81%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root{ --ink:#eaf0ff; --soft:#aab6d6; --accent:#ff7aa2; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05060a;overflow:hidden}
  body{ font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--ink); -webkit-tap-highlight-color:transparent; }
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}

  #caption{
    position:fixed;left:0;right:0;bottom:max(5vh,26px);
    text-align:center;pointer-events:none;
    opacity:0;transform:translateY(14px);
    transition:opacity 1.8s ease, transform 1.8s ease;padding:0 18px;
  }
  #caption.show{opacity:1;transform:none}
  #caption h1{
    margin:0 auto;max-width:24ch;font-size:clamp(20px,3.6vw,36px);font-weight:700;
    line-height:1.35;letter-spacing:.2px;font-style:italic;
    text-shadow:0 2px 30px rgba(0,0,0,.7), 0 0 26px rgba(255,122,162,.22);
  }
  #caption p{
    margin:.7em auto 0;font-size:clamp(12px,2.2vw,16px);letter-spacing:.18em;
    color:var(--soft);text-shadow:0 2px 18px rgba(0,0,0,.7);
  }

  .ctl{
    position:fixed;z-index:5;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.05);color:var(--soft);
    border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);
    font:inherit;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    transition:.25s ease;opacity:0;
  }
  .ctl.show{opacity:1}
  .ctl:hover,.ctl:focus-visible{outline:none;color:#fff;border-color:var(--accent);
    box-shadow:0 0 22px rgba(255,122,162,.25)}
  #replay{bottom:14px;right:16px;padding:9px 16px}

  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 58%, rgba(0,0,0,.5) 100%)}

  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--soft);font-size:13px;letter-spacing:.2em;text-transform:uppercase}
  #loader.hide{opacity:0;transition:opacity .6s ease;pointer-events:none}
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="vig"></div>

  <div id="caption">
    <h1 id="capH"></h1>
    <p id="capP"></p>
  </div>

  <button id="replay" class="ctl" aria-label="Собрать заново">собрать заново</button>
  <div id="loader">собираю небо…</div>

<script src="data.js"></script>
<script>
(function(){
"use strict";

/* =======================================================================
   НАСТРОЙКИ — РЕДАКТИРУЙ ЗДЕСЬ
   • HEADLINE — подпись, проявляется после сборки. \n = перенос строки.
   • SUBLINE  — маленькая подпись под ней.
   • TILE_OPACITY — насколько видны фото-неба поверх портрета (0.3..0.7).
   • CELL_BUDGET — детализация (число кусочков).
   • Тайминги анимации: SHOWCASE_* (медленный показ фото по одному),
     ASSEMBLE_MS / PIECE_MS (разгон и сборка в портрет).
   ======================================================================= */
var CONFIG = {
  HEADLINE: "В каждом закате, что нежно ловлю,\nв каждом мгновенье — тебя лишь люблю.",
  SUBLINE:  "Анечка ❤",
  TILE_OPACITY: 0.52,
  CELL_BUDGET: { desktop: 3800, mobile: 1700 },

  SHOWCASE_STAGGER: 300,   // пауза между появлением фото, мс
  SHOWCASE_GROW:    900,   // как долго одно фото плавно выплывает, мс
  SHOWCASE_HOLD:    700,   // пауза после последнего фото перед сборкой, мс
  SHOWCASE_SIZE:    0.32,  // размер фото на показе (доля от меньшей стороны экрана)
  ASSEMBLE_MS: 2300,       // разгон выпуска кусочков (чем дальше — тем быстрее)
  PIECE_MS:    900,        // длительность полёта одного кусочка

  BG_TOP: "#0a0e1c",
  BG_BOT: "#05060a"
};
/* =======================  КОНЕЦ НАСТРОЕК  ============================== */

var DATA = window.MOSAIC_DATA || {tiles:[],target:""};
var RM = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

var cv = document.getElementById("scene");
var ctx = cv.getContext("2d");
var capWrap = document.getElementById("caption");
var capH = document.getElementById("capH");
var capP = document.getElementById("capP");
var replayBtn = document.getElementById("replay");
var loader = document.getElementById("loader");

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
capH.innerHTML = CONFIG.HEADLINE.split("\n").map(esc).join("<br>");
capP.textContent = CONFIG.SUBLINE;

var dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
var W=0, H=0;
function isMobile(){ return Math.min(window.innerWidth, window.innerHeight) < 620; }

/* ---------- утилиты ---------- */
function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }
function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function rnd(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function loadImg(src){ return new Promise(function(res,rej){ var im=new Image(); im.onload=function(){res(im);}; im.onerror=rej; im.src=src; }); }
function avgColor(img){
  var c=document.createElement("canvas"); c.width=c.height=8;
  var x=c.getContext("2d"); x.drawImage(img,0,0,8,8);
  var d=x.getImageData(0,0,8,8).data, r=0,g=0,b=0,n=64;
  for(var i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; }
  return [r/n, g/n, b/n];
}

/* ---------- состояние ---------- */
var tiles=[], tileAvg=[], targetImg=null;
var cols=0, rows=0, cell=0, gridX=0, gridY=0, mW=0, mH=0;
var atlas=null, ac=0;
// по ячейкам
var Ncol=null,Nrow=null,Ti=null,Ccx=null,Ccy=null,Sx=null,Sy=null,Rot=null,Scl=null,Del=null,Keep=null,nCells=0;
// показ фото (16)
var anchX=[],anchY=[],appearAt=[],rotBase=[],showLong=0,driftAmp=0;
// тайминги
var ASSEMBLE_START=0, assembleDur=0, settleAt=0;
var stars=[], bgGrad=null;
var raf=null, startT=null, captionShown=false, settled=false;

/* ---------- фон ---------- */
function makeStars(){
  stars=[]; var n=clamp(Math.round((W*H)/(9000*dpr)),60,320);
  for(var i=0;i<n;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:rnd(0.4,1.6)*dpr,a:rnd(0.2,0.9),tw:rnd(0.5,1.6),ph:rnd(0,6.28)});
}
function makeBg(){ bgGrad=ctx.createLinearGradient(0,0,0,H); bgGrad.addColorStop(0,CONFIG.BG_TOP); bgGrad.addColorStop(1,CONFIG.BG_BOT); }
function drawBg(t){
  ctx.fillStyle=bgGrad; ctx.fillRect(0,0,W,H);
  for(var i=0;i<stars.length;i++){ var s=stars[i];
    var a=RM?s.a*0.7:s.a*(0.55+0.45*Math.sin(t*0.001*s.tw+s.ph));
    ctx.globalAlpha=clamp(a,0,1); ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.2832); ctx.fillStyle="#cdd8ff"; ctx.fill();
  }
  ctx.globalAlpha=1;
}

/* ---------- сетка + атлас ---------- */
function computeGrid(){
  var aspect=targetImg.width/targetImg.height;
  var budget=isMobile()?CONFIG.CELL_BUDGET.mobile:CONFIG.CELL_BUDGET.desktop;
  rows=clamp(Math.round(Math.sqrt(budget/aspect)),24,110);
  cols=clamp(Math.round(rows*aspect),18,110);
  var cssW=W/dpr, cssH=H/dpr;
  cell=Math.max(Math.floor(Math.min(cssW*0.92/cols, cssH*0.80/rows)),3);
  mW=cell*cols*dpr; mH=cell*rows*dpr;
  gridX=Math.round((W-mW)/2);
  gridY=Math.round((H*0.80-mH)/2 + H*0.02);
  if(gridY<H*0.03) gridY=Math.round(H*0.03);
}
function sampleTargetColors(){
  var c=document.createElement("canvas"); c.width=cols; c.height=rows;
  var x=c.getContext("2d"); x.drawImage(targetImg,0,0,cols,rows);
  return x.getImageData(0,0,cols,rows).data;
}
function pickTile(r,g,b){
  var best=[];
  for(var i=0;i<tileAvg.length;i++){ var t=tileAvg[i];
    best.push([(t[0]-r)*(t[0]-r)+(t[1]-g)*(t[1]-g)+(t[2]-b)*(t[2]-b), i]); }
  best.sort(function(a,b){return a[0]-b[0];});
  return best[Math.floor(Math.random()*Math.min(3,best.length))][1];
}
function buildAtlas(){
  var data=sampleTargetColors();
  ac=clamp(Math.round(cell*dpr),6,26);
  atlas=document.createElement("canvas"); atlas.width=cols*ac; atlas.height=rows*ac;
  var ax=atlas.getContext("2d");
  nCells=cols*rows;
  Ncol=new Int16Array(nCells); Nrow=new Int16Array(nCells); Ti=new Int16Array(nCells);
  Ccx=new Float32Array(nCells); Ccy=new Float32Array(nCells);
  Sx=new Float32Array(nCells); Sy=new Float32Array(nCells);
  Rot=new Float32Array(nCells); Scl=new Float32Array(nCells); Del=new Float32Array(nCells);
  Keep=new Uint8Array(nCells);

  var aw=atlas.width, ah=atlas.height, cx0=aw/2, cy0=ah/2;
  var R=Math.max(aw,ah)/2, outerR=R*1.12;     // граница, за которой край полностью растворён
  var op=CONFIG.TILE_OPACITY, idx=0;
  for(var ry=0;ry<rows;ry++){ for(var rx=0;rx<cols;rx++){
    var p=(ry*cols+rx)*4, r=data[p],g=data[p+1],b=data[p+2];
    var ti=pickTile(r,g,b), dx=rx*ac, dy=ry*ac;
    ax.globalAlpha=1; ax.fillStyle="rgb("+(r|0)+","+(g|0)+","+(b|0)+")"; ax.fillRect(dx,dy,ac,ac);
    ax.globalAlpha=op; ax.drawImage(tiles[ti],0,0,tiles[ti].width,tiles[ti].height,dx,dy,ac,ac); ax.globalAlpha=1;
    Ncol[idx]=rx; Nrow[idx]=ry; Ti[idx]=ti;
    Ccx[idx]=gridX+rx*cell*dpr+cell*dpr/2; Ccy[idx]=gridY+ry*cell*dpr+cell*dpr/2;
    // дальние (угловые) кусочки не летают — они всё равно растворены маской
    var adx=(rx+0.5)*ac-cx0, ady=(ry+0.5)*ac-cy0;
    Keep[idx]= (Math.sqrt(adx*adx+ady*ady) <= outerR) ? 1 : 0;
    idx++;
  }}

  // фейд-переход: края мозаики плавно растворяются в ночном фоне (эллипс-маска)
  ax.globalCompositeOperation="destination-in";
  var grad=ax.createRadialGradient(cx0,cy0,R*0.50, cx0,cy0,outerR);
  grad.addColorStop(0,"rgba(0,0,0,1)");
  grad.addColorStop(0.66,"rgba(0,0,0,0.96)");
  grad.addColorStop(1,"rgba(0,0,0,0)");
  ax.fillStyle=grad; ax.fillRect(0,0,aw,ah);
  ax.globalCompositeOperation="source-over";
}

/* ---------- показ фото по одному ---------- */
function seedShowcase(){
  anchX=[]; anchY=[]; appearAt=[]; rotBase=[];
  var cx=W/2, cy=gridY+mH/2, spread=Math.min(W,H)*0.30;
  showLong=Math.min(W,H)*CONFIG.SHOWCASE_SIZE;
  driftAmp=Math.min(W,H)*0.018;
  // порядок появления — перемешать
  var order=[]; for(var i=0;i<16;i++) order.push(i);
  for(var i=order.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=order[i]; order[i]=order[j]; order[j]=t; }
  for(var k=0;k<16;k++){
    // золотая спираль вокруг центра -> приятный разброс
    var rr=(k+0.6)/16, ang=k*2.399963;
    anchX[k]=cx+Math.cos(ang)*spread*Math.sqrt(rr);
    anchY[k]=cy+Math.sin(ang)*spread*Math.sqrt(rr)*0.92;
    rotBase[k]=rnd(-0.18,0.18);
    appearAt[order[k]]=k*CONFIG.SHOWCASE_STAGGER;
  }
  ASSEMBLE_START=(16-1)*CONFIG.SHOWCASE_STAGGER + CONFIG.SHOWCASE_GROW + CONFIG.SHOWCASE_HOLD;
  assembleDur=CONFIG.ASSEMBLE_MS + CONFIG.PIECE_MS + 80;
  settleAt=ASSEMBLE_START + assembleDur;
}
function showcasePos(i,t){
  var dx=Math.sin(t*0.0004 + i*1.7)*driftAmp;
  var dy=Math.cos(t*0.00033 + i*1.3)*driftAmp;
  return [anchX[i]+dx, anchY[i]+dy];
}
function drawShowcase(t, gAlpha){
  for(var i=0;i<16;i++){
    var ap=t-appearAt[i]; if(ap<=0) continue;
    var e=easeOutCubic(clamp(ap/CONFIG.SHOWCASE_GROW,0,1));
    var al=e*gAlpha; if(al<=0.01) continue;
    var pos=showcasePos(i,t);
    var sc=0.7+0.3*e;
    var rot=rotBase[i]+Math.sin(t*0.0003 + i)*0.04;
    var S=showLong*sc;
    ctx.save();
    ctx.globalAlpha=al;
    ctx.translate(pos[0],pos[1]); ctx.rotate(rot);
    ctx.shadowColor="rgba(0,0,0,0.45)"; ctx.shadowBlur=20*dpr; ctx.shadowOffsetY=6*dpr;
    ctx.drawImage(tiles[i],0,0,tiles[i].width,tiles[i].height,-S/2,-S/2,S,S);
    ctx.shadowColor="transparent"; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
    ctx.lineWidth=Math.max(1,1.2*dpr); ctx.strokeStyle="rgba(255,255,255,0.16)";
    ctx.strokeRect(-S/2,-S/2,S,S);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

/* ---------- сборка из кусочков ---------- */
function seedAssembly(){
  var cx=W/2, cy=gridY+mH/2;
  var maxDist=Math.sqrt((mW/2)*(mW/2)+(mH/2)*(mH/2))||1;
  var jit=showLong*0.42;
  for(var i=0;i<nCells;i++){
    var ti=Ti[i];
    Sx[i]=anchX[ti]+rnd(-1,1)*jit;
    Sy[i]=anchY[ti]+rnd(-1,1)*jit;
    Scl[i]=rnd(2.4,5.0);
    Rot[i]=rnd(-0.5,0.5);
    // задержка растёт от центра наружу с ускорением (степень >1 => разгон)
    var dx=Ccx[i]-cx, dy=Ccy[i]-cy, rank=Math.sqrt(dx*dx+dy*dy)/maxDist;
    Del[i]=CONFIG.ASSEMBLE_MS*Math.pow(rank,1.7) + rnd(0,90);
  }
}
function drawAssembly(bt){
  var pdpr=cell*dpr, half=pdpr/2;
  for(var i=0;i<nCells;i++){
    if(!Keep[i]) continue;
    var pr=(bt-Del[i])/CONFIG.PIECE_MS;
    if(pr<=0) continue;
    if(pr>=1){ ctx.drawImage(atlas,Ncol[i]*ac,Nrow[i]*ac,ac,ac,Ccx[i]-half,Ccy[i]-half,pdpr,pdpr); continue; }
    var e=easeInOutCubic(pr);
    var x=Sx[i]+(Ccx[i]-Sx[i])*e, y=Sy[i]+(Ccy[i]-Sy[i])*e;
    var sc=Scl[i]+(1-Scl[i])*e, rot=Rot[i]*(1-e), al=clamp(pr*2,0,1);
    ctx.save(); ctx.globalAlpha=al;
    ctx.translate(x,y); ctx.rotate(rot); ctx.scale(sc,sc);
    ctx.drawImage(atlas,Ncol[i]*ac,Nrow[i]*ac,ac,ac,-half,-half,pdpr,pdpr);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

function drawSettled(t){
  var breathe=RM?1:(1+0.005*Math.sin(t*0.0009));
  var w=mW*breathe, h=mH*breathe, ox=gridX-(w-mW)/2, oy=gridY-(h-mH)/2;
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(atlas,0,0,atlas.width,atlas.height,ox,oy,w,h);
}

/* ---------- кадр ---------- */
function frame(now){
  if(startT==null) startT=now; var t=now-startT;
  drawBg(now);
  if(RM){
    var a=clamp(t/1200,0,1); ctx.globalAlpha=a; drawSettled(t); ctx.globalAlpha=1;
    if(t>1100 && !captionShown) showCaption();
    raf=requestAnimationFrame(frame); return;
  }
  if(t < ASSEMBLE_START){
    drawShowcase(t, 1);
  } else if(t < settleAt){
    var bt=t-ASSEMBLE_START;
    var sf=clamp(1 - bt/650, 0, 1);   // фото показа плавно гаснут
    if(sf>0) drawShowcase(t, sf);
    drawAssembly(bt);
  } else {
    settled=true; drawSettled(t);
    if(!captionShown) showCaption();
  }
  raf=requestAnimationFrame(frame);
}
function showCaption(){ captionShown=true; capWrap.classList.add("show"); replayBtn.classList.add("show"); }

/* ---------- запуск / ресайз ---------- */
function start(){
  if(raf) cancelAnimationFrame(raf);
  seedShowcase(); seedAssembly();
  startT=null; captionShown=false; settled=false;
  capWrap.classList.remove("show"); replayBtn.classList.remove("show");
  raf=requestAnimationFrame(frame);
}
function showStill(){
  if(raf) cancelAnimationFrame(raf);
  seedShowcase();
  captionShown=true; settled=true;
  capWrap.classList.add("show"); replayBtn.classList.add("show");
  (function idle(now){ drawBg(now); drawSettled(now); raf=requestAnimationFrame(idle); })(performance.now());
}
function sizeCanvas(){
  var cssW=window.innerWidth, cssH=window.innerHeight;
  W=Math.round(cssW*dpr); H=Math.round(cssH*dpr);
  cv.width=W; cv.height=H; cv.style.width=cssW+"px"; cv.style.height=cssH+"px";
}
function rebuild(){ sizeCanvas(); makeBg(); makeStars(); if(targetImg){ computeGrid(); buildAtlas(); } }

var rzTimer=null;
window.addEventListener("resize", function(){
  if(rzTimer) clearTimeout(rzTimer);
  rzTimer=setTimeout(function(){ rebuild(); showStill(); }, 200);
});
cv.addEventListener("click", function(){ start(); });
replayBtn.addEventListener("click", function(e){ e.stopPropagation(); start(); });

/* ---------- инициализация ---------- */
Promise.all([
  Promise.all((DATA.tiles||[]).map(loadImg)),
  loadImg(DATA.target)
]).then(function(res){
  tiles=res[0]; targetImg=res[1]; tileAvg=tiles.map(avgColor);
  loader.classList.add("hide");
  rebuild();
  if(/[?&]still/.test(location.search)) showStill();
  else start();
}).catch(function(err){
  loader.textContent="не удалось загрузить изображения";
  try{ console.error(err); }catch(e){}
});

})();
</script>
</body>
</html>
